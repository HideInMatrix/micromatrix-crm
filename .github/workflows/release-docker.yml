name: Release Docker Images

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/default?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared workspace package
        run: pnpm --filter @micromatrix/shared build

      - name: Typecheck shared
        run: pnpm --filter @micromatrix/shared typecheck

      - name: Typecheck API
        run: pnpm --filter @micromatrix/api typecheck

      - name: Typecheck Web
        run: pnpm --filter @micromatrix/web typecheck

      - name: Lint
        run: pnpm lint

  docker-smoke:
    name: Verify Docker runtime
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and smoke test separated images
        run: bash scripts/docker-release-smoke.sh

  api-images:
    name: Build backend ${{ matrix.arch }} images
    needs: docker-smoke
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve lowercase image names
        id: image
        shell: bash
        run: |
          REPOSITORY="${GITHUB_REPOSITORY,,}"
          echo "api=ghcr.io/${REPOSITORY}-api" >> "$GITHUB_OUTPUT"
          echo "migrate=ghcr.io/${REPOSITORY}-migrate" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API Docker metadata
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.api }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push native API architecture
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.image.outputs.api }}:build-${{ github.sha }}-${{ matrix.arch }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=api-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=api-${{ matrix.arch }}
          provenance: mode=max

      - name: Migration Docker metadata
        id: migrate-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.migrate }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push native migration architecture
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/migrate.Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.image.outputs.migrate }}:build-${{ github.sha }}-${{ matrix.arch }}
          labels: ${{ steps.migrate-meta.outputs.labels }}
          cache-from: type=gha,scope=migrate-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=migrate-${{ matrix.arch }}
          provenance: mode=max

  api-manifest:
    name: Publish backend multi-arch manifests
    needs: api-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve lowercase image names
        id: image
        shell: bash
        run: |
          REPOSITORY="${GITHUB_REPOSITORY,,}"
          echo "api=ghcr.io/${REPOSITORY}-api" >> "$GITHUB_OUTPUT"
          echo "migrate=ghcr.io/${REPOSITORY}-migrate" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API Docker metadata
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.api }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Migration Docker metadata
        id: migrate-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.migrate }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Merge native backend images
        shell: bash
        env:
          API_IMAGE: ${{ steps.image.outputs.api }}
          API_TAGS: ${{ steps.api-meta.outputs.tags }}
          MIGRATE_IMAGE: ${{ steps.image.outputs.migrate }}
          MIGRATE_TAGS: ${{ steps.migrate-meta.outputs.tags }}
        run: |
          set -euo pipefail
          publish_manifest() {
            local image="$1"
            local tags="$2"
            local args=()
            while IFS= read -r tag; do
              [[ -n "$tag" ]] && args+=(--tag "$tag")
            done <<< "$tags"
            docker buildx imagetools create "${args[@]}" \
              "${image}:build-${GITHUB_SHA}-amd64" \
              "${image}:build-${GITHUB_SHA}-arm64"
            local first_tag
            first_tag="$(printf '%s\n' "$tags" | head -n 1)"
            docker buildx imagetools inspect "$first_tag"
          }

          publish_manifest "$API_IMAGE" "$API_TAGS"
          publish_manifest "$MIGRATE_IMAGE" "$MIGRATE_TAGS"

  web-image:
    name: Build Web image
    needs: docker-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: |
          REPOSITORY="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${REPOSITORY}-web" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: mode=max
