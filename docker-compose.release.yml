services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-default}
    volumes:
      - release_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-default}']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: ${API_IMAGE:-ghcr.io/hideinmatrix/micromatrix-crm-api:${APP_VERSION:-latest}}
    restart: 'no'
    command: ['./node_modules/.bin/prisma', 'migrate', 'deploy']
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${API_IMAGE:-ghcr.io/hideinmatrix/micromatrix-crm-api:${APP_VERSION:-latest}}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      INTEGRATION_CREDENTIALS_KEY: ${INTEGRATION_CREDENTIALS_KEY:?INTEGRATION_CREDENTIALS_KEY is required}
      WECOM_DEFAULT_TENANT_SLUG: ${WECOM_DEFAULT_TENANT_SLUG:-demo}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:8080}
      UPLOAD_DIR: /app/uploads
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    volumes:
      - release_uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    image: ${WEB_IMAGE:-ghcr.io/hideinmatrix/micromatrix-crm-web:${APP_VERSION:-latest}}
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:3000
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  release_pgdata:
  release_uploads:
