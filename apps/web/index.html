<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM</title>
    <script>
      try {
        const tenantFromQuery = new URLSearchParams(location.search).get('tenant')?.trim()
        const currentTenant =
          tenantFromQuery || localStorage.getItem('mmx-enterprise-branding-current')?.trim()
        if (currentTenant) {
          const raw = localStorage.getItem(`mmx-enterprise-branding:${currentTenant}`)
          if (raw) {
            const branding = JSON.parse(raw)
            if (typeof branding?.title === 'string' && branding.title.trim()) {
              document.title = branding.title.trim()
            }
          }
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
